/**:
  ros__parameters:
    fusion_distance: 100.0
    # VLP-16 clusters are vertically sparse, so use horizontal overlap at all ranges.
    strict_iou_fusion_distance: 0.0
    strict_iou_match_mode: "iou"
    rough_iou_match_mode: "iou_x"
    use_cluster_semantic_type: false
    only_allow_inside_cluster: true
    roi_scale_factor: 1.3
    iou_threshold: 0.3
    unknown_iou_threshold: 0.1
    remove_unknown: false
