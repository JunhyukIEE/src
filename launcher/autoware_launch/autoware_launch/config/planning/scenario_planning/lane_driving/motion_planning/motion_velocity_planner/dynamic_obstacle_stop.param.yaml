/**:
  ros__parameters:
    dynamic_obstacle_stop: # module to stop or before entering the immediate path of a moving object
      extra_object_width: 1.0  # [m] extra width around detected objects
      minimum_object_velocity: 0.1  # [m/s] keep newly tracked crossing vehicles
      stop_distance_buffer: 3.0  # [m] stop before the predicted crossing footprint
      use_predicted_crossing_paths: true
      crossing_time_margin: 1.0  # [s] prediction/actuation uncertainty
      crossing_min_angle: 0.523599  # [rad] leave same-direction following to cruise
      approach_velocity: 3.3  # [m/s] about 12 km/h while a crossing is pending
      approach_distance: 30.0  # [m] only limit speed near an actual predicted crossing
      departure_acceleration: 3.0  # [m/s2] conservative earliest arrival, including restart
      time_horizon: 5.0  # [s] time horizon used for collision checks
      hysteresis: 1.0  # [m] once a collision has been detected, this hysteresis is used on the collision detection
      add_stop_duration_buffer : 0.1  # [s] react after one 10 Hz perception frame
      remove_stop_duration_buffer : 0.3  # [s] bridge short track dropouts before releasing stop
      minimum_object_distance_from_ego_trajectory: 1.0  # [m] minimum distance between the footprints of ego and an object to consider for collision
      ignore_unavoidable_collisions : false  # still brake when a late collision is classified unavoidable
